<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영화 티어리스트</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#f1f3f8;background:#11151e}*{box-sizing:border-box}body{margin:0;padding:28px 22px 128px}h1{margin:0 0 24px;font-size:clamp(24px,4vw,34px);letter-spacing:-1px}.board{max-width:1200px;margin:auto}.tier{display:grid;grid-template-columns:116px 1fr;min-height:138px;margin-bottom:9px;border:1px solid #333c4b;border-radius:10px;overflow:hidden;background:#1b2230}.tier-name{display:flex;align-items:center;justify-content:center;color:#171923;font-weight:800;font-size:22px}.tier:nth-of-type(1) .tier-name{background:#ff8d91}.tier:nth-of-type(2) .tier-name{background:#ffb978}.tier:nth-of-type(3) .tier-name{background:#ffe18b}.tier:nth-of-type(4) .tier-name{background:#a9e6a7}.tier:nth-of-type(5) .tier-name{background:#9ad9ee}.tier:nth-of-type(6) .tier-name{background:#c4b4f0}.cards{display:flex;flex-wrap:wrap;align-content:center;gap:10px;padding:12px;min-width:0}.tier.over{outline:3px solid #fff;outline-offset:-3px}.poster{width:75px;height:110px;object-fit:cover;border-radius:5px;cursor:grab;user-select:none;box-shadow:0 2px 8px #0007}.poster:active{cursor:grabbing}.search-dock{position:fixed;bottom:0;left:0;right:0;background:#121824f5;border-top:1px solid #374152;padding:15px 20px 20px;z-index:10}.search-inner{max-width:1200px;margin:auto;position:relative}.search-form{display:flex;gap:9px}.search-form input{flex:1;min-width:0;background:#fff;color:#161b24;border:0;border-radius:7px;padding:14px;font-size:16px}.search-form button{background:#657ef0;color:white;border:0;border-radius:7px;padding:0 24px;font-size:16px;font-weight:700;cursor:pointer}.results{position:absolute;bottom:calc(100% + 10px);left:0;right:0;max-height:360px;overflow:auto;background:#242d3e;border:1px solid #45516a;border-radius:9px;box-shadow:0 10px 35px #0009}.result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;background:none;color:white;border:0;border-bottom:1px solid #394357;cursor:pointer;font-size:15px}.result:hover{background:#35415a}.result img{width:39px;height:58px;object-fit:cover;background:#566072;border-radius:3px}.message{padding:16px;color:#dce2ed}.delete-zone{display:none;position:fixed;top:10px;right:12px;z-index:20;padding:16px 23px;border:2px dashed #f47b82;border-radius:10px;background:#4b222be8;font-weight:700}.delete-zone.visible{display:block}.delete-zone.over{background:#a73343}@media(max-width:600px){body{padding:18px 10px 125px}.tier{grid-template-columns:76px 1fr;min-height:120px}.tier-name{font-size:17px}.cards{gap:6px;padding:7px}.poster{width:62px;height:93px}.search-dock{padding:12px 10px 16px}.search-form button{padding:0 14px}}
</style>
</head>
<body>
<main class="board"><h1>🎬 영화 티어리스트</h1><div id="tiers"></div></main>
<div id="deleteZone" class="delete-zone">여기에 놓아 삭제</div>
<footer class="search-dock"><div class="search-inner"><div id="results" class="results" hidden></div><form id="searchForm" class="search-form"><input id="searchInput" placeholder="영화 제목 검색" aria-label="영화 제목 검색" autocomplete="off" required><button type="submit">검색</button></form></div></footer>
<script src="./secure.js"></script>
<script>
'use strict';
// TMDB_READ_ACCESS_TOKEN은 같은 폴더의 secure.js에서 불러옵니다.
const TIERS=['걸작','명작','대작','역작','수작','평작'];
const STORAGE_KEY='movie-tierlist-v1';
let movies=[];
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))movies=saved.filter(m=>m&&TIERS.includes(m.tier)&&typeof m.id==='number'&&typeof m.poster==='string');}catch{}
const tiersEl=document.getElementById('tiers');
const resultsEl=document.getElementById('results');
const deleteZone=document.getElementById('deleteZone');
let draggedId=null;
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(movies));}
function render(){tiersEl.replaceChildren();for(const tier of TIERS){const row=document.createElement('section');row.className='tier';row.dataset.tier=tier;const name=document.createElement('div');name.className='tier-name';name.textContent=tier;const cards=document.createElement('div');cards.className='cards';for(const movie of movies.filter(m=>m.tier===tier)){const img=document.createElement('img');img.className='poster';img.src='https://image.tmdb.org/t/p/w185'+movie.poster;img.alt=movie.title+' 포스터';img.title=movie.title;img.draggable=true;img.dataset.id=String(movie.id);img.addEventListener('dragstart',e=>{draggedId=movie.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(movie.id));deleteZone.classList.add('visible');});img.addEventListener('dragend',endDrag);cards.append(img);}row.append(name,cards);row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';row.classList.add('over');});row.addEventListener('dragleave',e=>{if(!row.contains(e.relatedTarget))row.classList.remove('over');});row.addEventListener('drop',e=>{e.preventDefault();const id=Number(e.dataTransfer.getData('text/plain'));const movie=movies.find(m=>m.id===id);if(movie){movie.tier=tier;save();render();}endDrag();});tiersEl.append(row);}}
function endDrag(){draggedId=null;deleteZone.classList.remove('visible','over');document.querySelectorAll('.tier.over').forEach(el=>el.classList.remove('over'));}
deleteZone.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';deleteZone.classList.add('over');});
deleteZone.addEventListener('dragleave',()=>deleteZone.classList.remove('over'));
deleteZone.addEventListener('drop',e=>{e.preventDefault();const id=Number(e.dataTransfer.getData('text/plain'));movies=movies.filter(m=>m.id!==id);save();render();endDrag();});
function message(text){resultsEl.replaceChildren();const p=document.createElement('div');p.className='message';p.textContent=text;resultsEl.append(p);resultsEl.hidden=false;}
const form=document.getElementById('searchForm');
form.addEventListener('submit',async e=>{e.preventDefault();const query=document.getElementById('searchInput').value.trim();if(!query)return;if(!TMDB_READ_ACCESS_TOKEN){message('secure.js 파일에 TMDB API Read Access Token을 설정해 주세요.');return;}message('검색 중...');try{const response=await fetch('https://api.themoviedb.org/3/search/movie?language=ko-KR&query='+encodeURIComponent(query),{headers:{Authorization:'Bearer '+TMDB_READ_ACCESS_TOKEN,accept:'application/json'}});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();resultsEl.replaceChildren();const items=(data.results||[]).filter(m=>m.poster_path);if(!items.length){message('검색 결과가 없습니다.');return;}for(const item of items){const button=document.createElement('button');button.type='button';button.className='result';const img=document.createElement('img');img.src='https://image.tmdb.org/t/p/w92'+item.poster_path;img.alt='';const label=document.createElement('span');label.textContent=item.title;button.append(img,label);button.addEventListener('click',()=>{if(!movies.some(m=>m.id===item.id)){movies.push({id:item.id,title:item.title,poster:item.poster_path,tier:TIERS[0]});save();render();}resultsEl.hidden=true;document.getElementById('searchInput').value='';});resultsEl.append(button);}resultsEl.hidden=false;}catch(err){message('영화를 검색하지 못했습니다. API 토큰과 인터넷 연결을 확인해 주세요.');}});
render();
</script>
</body>
</html>
