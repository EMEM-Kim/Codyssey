<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 이미지 맞추기 퀴즈</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#20263b;background:#f5f6fb}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1000px;margin:0 auto;padding:28px 18px 64px}
h1{font-size:clamp(1.5rem,4vw,2rem);margin:0 0 24px}
h2{font-size:1.35rem;margin:0 0 16px}
.panel{background:white;border:1px solid #e1e5ef;border-radius:16px;padding:24px;box-shadow:0 5px 24px #2633540a}
[hidden]{display:none!important}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{border:0;border-radius:9px;padding:11px 17px;font:inherit;font-weight:650;cursor:pointer;background:#4658c9;color:white}
button.secondary{background:#e9ecf6;color:#27314c}
button.danger{background:#b83c4b}
button:disabled{opacity:.48;cursor:not-allowed}
input[type="text"]{width:100%;min-width:0;padding:11px;border:1px solid #c9d0df;border-radius:8px;font:inherit}
input[type="file"]{max-width:100%;font:inherit}
.notice{color:#58627a;margin:8px 0 18px;line-height:1.6}
.error{color:#a82435;min-height:1.5em;font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin:20px 0}
.item{border:1px solid #e1e5ef;border-radius:12px;padding:12px;min-width:0}
.item img{width:100%;height:165px;object-fit:contain;background:#f3f5fa;border-radius:8px}
.item label{display:block;margin:9px 0 5px;font-size:.9rem;font-weight:650}
.item button{margin-top:9px;width:100%}
.file-choices{display:flex;align-items:center;flex-wrap:wrap;gap:14px}
.file-choices label{display:grid;gap:6px;font-weight:650;font-size:.93rem}
.gallery-controls{display:flex;justify-content:center;gap:12px;align-items:center;margin:8px 0 22px}
.gallery-controls span{font-weight:650;color:#34415e}
#question-count{width:110px}
#upload-info{margin-top:8px}
.quiz-layout{max-width:620px;margin:auto;text-align:center}
.quiz-image{display:block;max-width:100%;width:auto;max-height:390px;margin:16px auto 22px;object-fit:contain;border-radius:12px}
.quiz-layout form{display:flex;gap:9px;margin:16px 0}
.quiz-layout form input{flex:1}
.feedback{margin:16px 0;font-weight:700;line-height:1.7}
.score{font-size:clamp(3rem,10vw,5rem);font-weight:850;text-align:center;margin:8px 0 12px;letter-spacing:-.04em;color:#273c9f;font-variant-numeric:tabular-nums}
.result-hero{max-width:560px;margin:18px auto 26px;padding:30px 20px 28px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#eff2ff,#f8edff);border:1px solid #e5e5ff;position:relative;overflow:hidden}
.result-hero::before,.result-hero::after{content:"✦";position:absolute;color:#a5a5ee;font-size:1.6rem}
.result-hero::before{top:22px;left:11%}
.result-hero::after{right:10%;bottom:20px}
.result-icon{display:block;font-size:3.3rem;line-height:1.3;margin-bottom:8px}
.mode-picker{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
.mode-picker label{font-weight:700}
.mode-picker select{font:inherit;padding:10px;border:1px solid #c9d0df;border-radius:9px;background:white}
.quiz-meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:12px 0}
.quiz-meta span{background:#eef0fc;border-radius:9px;padding:7px 12px;font-weight:700}
#combo{color:#7b35b5}
#timer{color:#ac3245}
.hint-info{min-height:24px;font-weight:700;color:#344b8e}
.review{max-width:650px;margin:18px auto}
.review h3{font-size:1.05rem;margin:0 0 10px}
.review-list{display:grid;gap:9px}
.review-item{display:flex;align-items:center;text-align:left;gap:12px;border:1px solid #e1e5ef;border-radius:11px;padding:9px;background:#fafbff}
.review-item img{width:64px;height:64px;object-fit:contain;background:#eef1f7;border-radius:8px}
.review-item div{min-width:0;overflow-wrap:anywhere}
.review-item strong{display:block}
.review-item small{color:#58627a}
#feedback{min-height:24px}
.result-caption{font-size:1rem;font-weight:750;color:#4d5680}
#result h2{text-align:center}
#result .actions{margin-top:22px}
@media(max-width:520px){main{padding:18px 12px 40px}.panel{padding:16px}.quiz-layout form{flex-direction:column}.quiz-layout form button{width:100%}.gallery{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.item img{height:130px}}
</style>
</head>
<body>
<main>
<h1>캐릭터 이미지 맞추기 퀴즈</h1>
<section id="manage" class="panel">
<h2>이미지 등록·관리</h2>
<div class="toolbar">
<div class="file-choices">
<label>이미지 파일 선택<input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple aria-label="캐릭터 이미지 파일 선택"></label>
<label>폴더째 등록 (Chrome/Edge)<input id="folder" type="file" webkitdirectory directory multiple aria-label="캐릭터 이미지 폴더 선택"></label>
</div>
<button id="clear" class="danger" type="button">전체 삭제</button>
</div>
<p id="count" class="notice"></p>
<p id="manage-error" class="error" role="alert"></p>
<div id="gallery" class="gallery"></div>
<div class="gallery-controls" id="gallery-controls" hidden>
<button id="prev-page" class="secondary" type="button">이전</button>
<span id="page-label" aria-live="polite"></span>
<button id="next-page" class="secondary" type="button">다음</button>
</div>
<div class="mode-picker">
<label for="mode">게임 모드</label>
<select id="mode"><option value="normal">기본 모드 (시간 제한 없음)</option><option value="timed">타임어택 (문제당 20초)</option></select>
</div>
<div class="mode-picker"><label for="question-count">출제할 문제 수</label>
<input id="question-count" type="number" min="10" step="1" value="10" aria-label="무작위 출제 문제 수">
<button id="select-all" class="secondary" type="button">전체 이미지 출제</button>
<span id="question-count-guide" class="notice"></span></div>
<button id="start" type="button" disabled>게임 시작</button>
</section>
<section id="quiz" class="panel" hidden>
<div class="quiz-layout">
<h2>캐릭터 이름 맞히기</h2>
<p id="progress"></p>
<div class="quiz-meta"><span id="combo">연속 정답: 0</span><span id="hint-count">남은 힌트: 3</span><span id="timer" hidden>남은 시간: 20초</span></div>
<img id="question-image" class="quiz-image" alt="문제 캐릭터 이미지">
<form id="answer-form">
<input id="answer" type="text" placeholder="캐릭터 이름 입력" aria-label="정답 입력" autocomplete="off">
<button id="submit" type="submit">제출</button>
</form>
<div id="question-actions" class="actions" style="justify-content:center">
<button id="skip" type="button" class="secondary">건너뛰기</button>
<button id="hint-button" type="button" class="secondary">힌트 (첫 글자)</button>
</div>
<p id="hint-text" class="hint-info" aria-live="polite"></p>
<p id="feedback" class="feedback" aria-live="polite"></p>
<button id="next" type="button" hidden>다음 문제</button>
</div>
</section>
<section id="result" class="panel" hidden>
<h2>퀴즈 결과</h2>
<div class="result-hero" aria-label="퀴즈 완료 결과">
<span class="result-icon" aria-hidden="true">🏆</span>
<div class="result-caption">퀴즈 완료! 맞힌 문제 수</div>
<div id="score" class="score" aria-live="polite"></div>
</div>
<section class="review" id="review" hidden><h3>오답 노트</h3><div id="review-list" class="review-list"></div></section>
<div class="actions" style="justify-content:center">
<button id="restart" type="button">다시 시작</button>
<button id="back" type="button" class="secondary">이미지 등록·관리로 돌아가기</button>
</div>
</section>
</main>
<script>
"use strict";
(() => {
  const KEY = "character-image-quiz-v1";
  const DB_NAME = "character-image-quiz-v8";
  const STORE = "images";
  const PAGE_SIZE = 24;
  const $ = id => document.getElementById(id);
  const manage = $("manage"), quiz = $("quiz"), result = $("result");
  let images = [], database = null, galleryPage = 0, working = false;
  let questions = [], index = 0, correct = 0, answered = false;
  let combo = 0, bestCombo = 0, hintsLeft = 3, hintUsed = false, mistakes = [];
  let mode = "normal", timerHandle = null, deadline = 0;
  const ROUND_SECONDS = 20;
  function stopClock() {
    if (timerHandle !== null) clearInterval(timerHandle);
    timerHandle = null;
  }
  function refreshMeta() {
    $("combo").textContent = `연속 정답: ${combo}`;
    $("hint-count").textContent = `남은 힌트: ${hintsLeft}`;
    $("hint-button").disabled = answered || hintUsed || hintsLeft === 0;
  }
  function tickClock() {
    if (mode !== "timed" || answered || quiz.hidden) return;
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $("timer").textContent = `남은 시간: ${left}초`;
    if (left === 0) finishQuestion(false, false, true);
  }
  function startClock() {
    stopClock();
    $("timer").hidden = mode !== "timed";
    if (mode !== "timed") return;
    deadline = Date.now() + ROUND_SECONDS * 1000;
    tickClock();
    timerHandle = setInterval(tickClock, 200);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) tickClock();
  });


  function show(screen) {
    manage.hidden = screen !== "manage";
    quiz.hidden = screen !== "quiz";
    result.hidden = screen !== "result";
  }
  function error(message) { $("manage-error").textContent = message; }
  function setWorking(value) {
    working = value;
    $("files").disabled = value;
    $("folder").disabled = value;
    $("clear").disabled = value;
    updateStatus();
  }
  function validRecord(item) {
    return item && typeof item.id === "string" && typeof item.name === "string" &&
      typeof item.data === "string" && /^data:image\/(jpeg|png|webp);base64,/i.test(item.data);
  }
  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("이 브라우저에서는 IndexedDB를 사용할 수 없습니다.")); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE, {keyPath: "id"});
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("다른 탭에서 데이터베이스가 사용 중입니다."));
    });
  }
  function allRecords() {
    return new Promise((resolve, reject) => {
      const req = database.transaction(STORE, "readonly").objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function changeRecords(operation, records = []) {
    return new Promise((resolve, reject) => {
      const tx = database.transaction(STORE, "readwrite");
      const store = tx.objectStore(STORE);
      if (operation === "put") records.forEach(item => store.put(item));
      else if (operation === "delete") records.forEach(id => store.delete(id));
      else if (operation === "clear") store.clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }
  async function initialize() {
    setWorking(true);
    try {
      database = await openDB();
      images = (await allRecords()).filter(validRecord);
      // v7까지의 localStorage 데이터를 한 번만 IndexedDB로 안전하게 옮긴다.
      const raw = localStorage.getItem(KEY);
      if (raw !== null) {
        const legacy = JSON.parse(raw);
        if (!Array.isArray(legacy) || !legacy.every(validRecord)) {
          throw new Error("기존 저장 데이터 형식이 올바르지 않습니다.");
        }
        const known = new Set(images.map(item => item.data));
        const additions = legacy.filter(item => {
          if (known.has(item.data)) return false;
          known.add(item.data); return true;
        });
        if (additions.length) await changeRecords("put", additions);
        images.push(...additions);
        localStorage.removeItem(KEY); // 성공한 마이그레이션 이후에만 제거
      }
      error("");
    } catch (err) {
      error("이미지 저장소를 열거나 이전 데이터를 이전하지 못했습니다: " + err.message);
      // 손실 방지를 위해 불완전한 데이터베이스가 열렸을 경우에도 등록을 차단한다.
      database = null;
    }
    setWorking(false);
    render();
    show("manage");
  }
  function ready() {
    const count = Number($("question-count").value);
    return !!database && !working && images.length >= 10 &&
      images.every(item => item.name.trim().length > 0) &&
      Number.isInteger(count) && count >= 10 && count <= images.length;
  }
  function render() {
    const pages = Math.max(1, Math.ceil(images.length / PAGE_SIZE));
    galleryPage = Math.min(Math.max(0, galleryPage), pages - 1);
    const gallery = $("gallery");
    gallery.replaceChildren();
    images.slice(galleryPage * PAGE_SIZE, (galleryPage + 1) * PAGE_SIZE).forEach(item => {
      const card = document.createElement("div");
      card.className = "item";
      const img = document.createElement("img");
      img.src = item.data;
      img.alt = "등록된 캐릭터 이미지";
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "text";
      input.value = item.name;
      input.id = "name-" + item.id;
      label.htmlFor = input.id;
      label.textContent = "정답";
      input.addEventListener("change", async () => {
        const revised = {...item, name: input.value};
        input.disabled = true;
        try {
          await changeRecords("put", [revised]);
          images = images.map(x => x.id === item.id ? revised : x);
          error("");
        } catch (err) {
          input.value = item.name;
          error("정답 수정 저장에 실패했습니다: " + err.message);
        } finally { input.disabled = false; updateStatus(); }
      });
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "개별 삭제";
      remove.addEventListener("click", async () => {
        remove.disabled = true;
        try {
          await changeRecords("delete", [item.id]);
          images = images.filter(x => x.id !== item.id);
          error("");
          render();
        } catch (err) { error("이미지 삭제 실패: " + err.message); remove.disabled = false; }
      });
      card.append(img, label, input, remove);
      gallery.append(card);
    });
    $("gallery-controls").hidden = images.length <= PAGE_SIZE;
    $("page-label").textContent = `${galleryPage + 1} / ${pages} 페이지 · 페이지당 최대 ${PAGE_SIZE}장`;
    $("prev-page").disabled = galleryPage === 0;
    $("next-page").disabled = galleryPage === pages - 1;
    updateStatus();
  }
  function updateStatus() {
    const count = images.length;
    const input = $("question-count");
    input.max = String(Math.max(10, count));
    $("question-count-guide").textContent = count >= 10 ? `10 ~ ${count}문제 선택 가능` : "이미지를 10장 이상 등록해야 합니다.";
    $("count").textContent = !database ? "이미지 저장소 준비 중이거나 연결에 실패했습니다." : count < 10
      ? `등록된 이미지: ${count}장 · 게임 시작까지 ${10 - count}장 더 필요합니다.`
      : images.some(x => !x.name.trim())
        ? `등록된 이미지: ${count}장 · 빈 정답을 모두 입력해야 게임을 시작할 수 있습니다.`
        : `등록된 이미지: ${count}장 · 출제할 문제 수를 선택하세요.`;
    $("start").disabled = !ready();
  }
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("파일 읽기 실패"));
      reader.readAsDataURL(file);
    });
  }
  function isAllowed(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    return ["jpg", "jpeg", "png", "webp"].includes(ext) &&
      ["image/jpeg", "image/png", "image/webp"].includes(file.type);
  }
  async function importFiles(selected) {
    if (!selected.length || !database || working) return;
    setWorking(true);
    let rejected = 0, failed = 0, duplicates = 0;
    const additions = [];
    const known = new Set(images.map(item => item.data));
    try {
      for (const file of selected) {
        if (!isAllowed(file)) { rejected++; continue; }
        try {
          const data = await readFile(file);
          if (known.has(data)) { duplicates++; continue; }
          known.add(data);
          additions.push({
            id: crypto.randomUUID ? crypto.randomUUID() :
              Date.now().toString(36) + Math.random().toString(36).slice(2),
            name: file.name.replace(/\.[^.]+$/, ""),
            data
          });
        } catch (err) { failed++; }
      }
      if (additions.length) {
        await changeRecords("put", additions);
        images.push(...additions);
        render();
      }
      error(`새 이미지 ${additions.length}장 등록. ${duplicates ? `중복 ${duplicates}장 제외. ` : ""}${rejected ? `이미지가 아닌 파일/지원하지 않는 형식 ${rejected}개 제외. ` : ""}${failed ? `읽기 실패 ${failed}개. ` : ""}`);
    } catch (err) {
      error("폴더/이미지 저장에 실패했습니다. 저장 공간이나 브라우저 권한을 확인하세요: " + err.message);
    } finally { setWorking(false); }
  }
  $("files").addEventListener("change", event => {
    const selected = [...event.target.files];
    event.target.value = "";
    importFiles(selected);
  });
  $("folder").addEventListener("change", event => {
    const selected = [...event.target.files];
    event.target.value = "";
    importFiles(selected);
  });
  $("prev-page").addEventListener("click", () => { if (galleryPage > 0) { galleryPage--; render(); } });
  $("next-page").addEventListener("click", () => {
    if ((galleryPage + 1) * PAGE_SIZE < images.length) { galleryPage++; render(); }
  });
  $("question-count").addEventListener("input", updateStatus);
  $("select-all").addEventListener("click", () => {
    if (images.length >= 10) {
      $("question-count").value = String(images.length);
      updateStatus();
    }
  });
  $("clear").addEventListener("click", async () => {
    if (!images.length || !confirm("등록된 이미지와 정답을 모두 삭제하시겠습니까?")) return;
    setWorking(true);
    try {
      await changeRecords("clear");
      images = []; galleryPage = 0;
      $("question-count").value = "10";
      error("");
      render();
    } catch (err) { error("전체 삭제에 실패했습니다: " + err.message); }
    finally { setWorking(false); }
  });
  function shuffled() {
    const copy = images.map(item => ({...item}));
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }
  function begin() {
    if (!ready()) return;
    questions = shuffled().slice(0, Number($("question-count").value));
    index = 0;
    correct = 0;
    combo = 0;
    bestCombo = 0;
    hintsLeft = 3;
    mistakes = [];
    mode = $("mode").value;
    show("quiz");
    present();
  }
  function present() {
    stopClock();
    answered = false;
    hintUsed = false;
    const item = questions[index];
    $("progress").textContent = `${index + 1} / ${questions.length}`;
    $("question-image").src = item.data;
    $("answer").value = "";
    $("answer").disabled = false;
    $("submit").disabled = false;
    $("skip").hidden = false;
    $("feedback").textContent = "";
    $("hint-text").textContent = "";
    $("next").hidden = true;
    refreshMeta();
    startClock();
    $("answer").focus();
  }
  function normalize(value) {
    return String(value).normalize("NFKC").replace(/[\s\u200B-\u200D\uFEFF]/g, "").toLocaleLowerCase("ko-KR");
  }
  function finishQuestion(isCorrect, skipped, timedOut = false) {
    if (answered) return;
    // 타임어택에서는 시간이 지난 뒤 제출해도 정답으로 처리하지 않는다.
    if (mode === "timed" && Date.now() >= deadline) {
      isCorrect = false;
      skipped = false;
      timedOut = true;
    }
    answered = true;
    stopClock();
    if (isCorrect) {
      correct++;
      combo++;
      bestCombo = Math.max(bestCombo, combo);
    } else {
      combo = 0;
      mistakes.push({
        name: questions[index].name,
        data: questions[index].data,
        input: timedOut ? "시간 초과" : skipped ? "건너뛰기" : $("answer").value || "빈 답안"
      });
    }
    $("feedback").textContent = `${timedOut ? "시간 초과 (오답)" : skipped ? "건너뛰기 (오답)" : isCorrect ? "정답입니다!" : "오답입니다."} 실제 정답: ${questions[index].name}`;
    $("answer").disabled = true;
    $("submit").disabled = true;
    $("skip").hidden = true;
    $("hint-button").disabled = true;
    $("next").hidden = false;
    refreshMeta();
  }
  $("answer-form").addEventListener("submit", event => {
    event.preventDefault();
    if (answered) return;
    finishQuestion(normalize($("answer").value) === normalize(questions[index].name), false);
  });
  $("skip").addEventListener("click", () => finishQuestion(false, true));
  $("hint-button").addEventListener("click", () => {
    if (answered || hintUsed || hintsLeft === 0) return;
    if (mode === "timed" && Date.now() >= deadline) { tickClock(); return; }
    hintsLeft--;
    hintUsed = true;
    // 분해된 한글 자모(예: ᄅ + ᅩ)를 완성형 음절(로)로 결합한 뒤 첫 글자를 가져온다.
    const name = questions[index].name.trim().normalize("NFC");
    const first = [...name][0] || "?";
    $("hint-text").textContent = `힌트: 정답 첫 글자는 "${first}"입니다.`;
    refreshMeta();
  });
  function showReview() {
    const container = $("review-list");
    container.replaceChildren();
    $("review").hidden = mistakes.length === 0;
    mistakes.forEach(item => {
      const row = document.createElement("div");
      row.className = "review-item";
      const img = document.createElement("img");
      img.src = item.data;
      img.alt = "틀린 문제 이미지";
      const info = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = `정답: ${item.name}`;
      const detail = document.createElement("small");
      detail.textContent = `입력: ${item.input}`;
      info.append(title, detail);
      row.append(img, info);
      container.append(row);
    });
  }
  $("next").addEventListener("click", () => {
    if (!answered) return;
    index++;
    if (index === questions.length) {
      stopClock();
      $("score").textContent = `${correct} / ${questions.length}`;
      showReview();
      show("result");
    } else present();
  });
  $("start").addEventListener("click", begin);
  $("restart").addEventListener("click", begin);
  $("back").addEventListener("click", () => { render(); show("manage"); });
  initialize();
})();
</script>
</body>
</html>
