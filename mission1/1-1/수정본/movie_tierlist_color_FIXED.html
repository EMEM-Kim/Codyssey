<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 티어리스트</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#f1f3f8;background:#11151e}*{box-sizing:border-box}body{margin:0;padding:24px 16px 220px}.board{max-width:1100px;margin:auto}h1{font-size:clamp(23px,4vw,32px);margin:0 0 8px}.intro{color:#b6c0d1;margin:0 0 20px;font-size:14px}.tier{display:grid;grid-template-columns:105px 1fr;min-height:104px;margin-bottom:8px;border:1px solid #364052;border-radius:9px;overflow:hidden;background:#1b2230}.tier-name{display:flex;align-items:center;justify-content:center;color:#17202b;font-weight:800;font-size:21px}.tier[data-destination="걸작"] .tier-name{background:#ff8d91}.tier[data-destination="명작"] .tier-name{background:#ffb978}.tier[data-destination="대작"] .tier-name{background:#ffe18b}.tier[data-destination="역작"] .tier-name{background:#a9e6a7}.tier[data-destination="수작"] .tier-name{background:#9ad9ee}.tier[data-destination="평작"] .tier-name{background:#c4b4f0}.cards{display:flex;align-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:12px;min-width:0}.drop-target.over{outline:3px solid #fff;outline-offset:-3px}.movie-card{background:#2e3b53;border:1px solid #536783;color:white;border-radius:7px;min-width:95px;max-width:180px;min-height:72px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;overflow-wrap:anywhere;cursor:grab;font-size:14px;font-weight:650;user-select:none}.movie-card:active{cursor:grabbing}.movie-card:focus-visible{outline:3px solid #fff}.dock{position:fixed;bottom:0;left:0;right:0;background:#121824f7;border-top:1px solid #465269;padding:12px 16px 18px;z-index:10}.dock-inner{max-width:1100px;margin:auto}.pool-heading{font-size:13px;color:#cbd4e2;margin:0 0 7px}.pool{min-height:68px;max-height:110px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px dashed #52617a;border-radius:7px;padding:8px;margin-bottom:10px}.pool .movie-card{min-height:45px}.form{display:flex;gap:8px}.form input{flex:1;min-width:0;background:white;color:#17202b;border:0;border-radius:6px;padding:12px;font-size:16px}.form button{border:0;border-radius:6px;background:#657ef0;color:white;font-weight:700;padding:0 18px;font-size:15px;cursor:pointer}.trash{position:fixed;top:12px;right:12px;display:none;z-index:20;background:#562830;border:2px dashed #ff9098;border-radius:8px;padding:15px;color:white;font-weight:700}.trash.visible{display:block}.trash.over{background:#9e3646}.status{font-size:12px;color:#cbd4e2;min-height:18px;margin:7px 0 0}.help{font-size:12px;color:#aebbd0;margin:8px 0 0}@media(max-width:600px){body{padding:15px 8px 250px}.tier{grid-template-columns:68px 1fr;min-height:92px}.tier-name{font-size:16px}.cards{gap:5px;padding:6px}.movie-card{min-width:75px;min-height:60px;max-width:130px;padding:7px;font-size:12px}.dock{padding:10px 8px 13px}.form button{padding:0 12px}.trash{padding:10px}.pool{max-height:120px}}

/* 등급별 고대비 색상: 이름과 카드 영역 모두 명확히 구분 */
.tier { border-width:2px; }
.tier-name { color:#101827 !important; text-shadow:none; font-weight:900; }
.tier[data-destination="걸작"] { background:#38242e; border-color:#d86d80; }
.tier[data-destination="명작"] { background:#382c24; border-color:#dba16c; }
.tier[data-destination="대작"] { background:#383424; border-color:#dfc86d; }
.tier[data-destination="역작"] { background:#26372c; border-color:#8acb98; }
.tier[data-destination="수작"] { background:#24343d; border-color:#78c2dd; }
.tier[data-destination="평작"] { background:#302a3e; border-color:#b5a2df; }
.tier[data-destination="걸작"] .tier-name { background:#ff9baa; }
.tier[data-destination="명작"] .tier-name { background:#ffc18a; }
.tier[data-destination="대작"] .tier-name { background:#ffe78d; }
.tier[data-destination="역작"] .tier-name { background:#a9e6b1; }
.tier[data-destination="수작"] .tier-name { background:#a2dff4; }
.tier[data-destination="평작"] .tier-name { background:#d1bef5; }
.tier .movie-card { background:#f7f9ff; color:#162033; border:2px solid #d5deef; font-weight:800; box-shadow:0 2px 8px #0004; }
.tier .movie-card:hover { background:#fff; border-color:#fff; }
.pool .movie-card { background:#e7edfa; color:#14223b; border:2px solid #b7c8e9; }
.tier.drop-target.over { outline:3px solid #fff; outline-offset:-4px; }
</style>
</head>
<body>
<main class="board"><h1>🎬 영화 티어리스트</h1><p class="intro">영화 제목을 추가한 뒤 원하는 등급으로 옮겨 보세요. 기록은 이 브라우저에 자동 저장됩니다.</p><div id="tiers"></div></main>
<div id="trash" class="trash drop-target" data-destination="trash">🗑️ 여기에 놓아 삭제</div>
<footer class="dock"><div class="dock-inner"><p class="pool-heading">추가한 영화 · 카드를 등급 행으로 끌어다 놓으세요</p><div id="pool" class="pool drop-target" data-destination="pool"></div><form id="form" class="form"><input id="titleInput" type="text" placeholder="영화 제목 입력" aria-label="영화 제목" maxlength="100" required autocomplete="off"><button type="submit">추가</button></form><p id="status" class="status" role="status" aria-live="polite"></p><p class="help">PC: 드래그하여 이동/삭제 · 모바일/키보드: 카드를 클릭하여 이동할 위치 선택</p></div></footer>
<script>
'use strict';
const TIERS=['걸작','명작','대작','역작','수작','평작'];
const KEY='movie-tierlist-offline-v1';
const pool=document.getElementById('pool');
const tiers=document.getElementById('tiers');
const trash=document.getElementById('trash');
const status=document.getElementById('status');
const titleInput=document.getElementById('titleInput');
let movies=[];
try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))movies=stored.filter(m=>m&&typeof m.id==='string'&&typeof m.title==='string'&&(m.tier==='pool'||TIERS.includes(m.tier)));}catch(e){status.textContent='이전 저장 데이터를 읽지 못해 새 목록으로 시작합니다.';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(movies));}catch(e){status.textContent='브라우저 저장이 차단되어 기록이 유지되지 않을 수 있습니다.';}}
function move(id,destination){const movie=movies.find(m=>m.id===id);if(!movie)return;if(destination==='trash'){movies=movies.filter(m=>m.id!==id);status.textContent='영화를 삭제했습니다.';}else if(destination==='pool'||TIERS.includes(destination)){movie.tier=destination;status.textContent='영화를 이동했습니다.';}else return;save();render();}
function makeCard(movie){const card=document.createElement('button');card.type='button';card.className='movie-card';card.textContent=movie.title;card.draggable=true;card.title=movie.title+' — 클릭하면 이동/삭제 메뉴';card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',movie.id);e.dataTransfer.effectAllowed='move';trash.classList.add('visible');});card.addEventListener('dragend',endDrag);card.addEventListener('click',()=>{const choice=window.prompt('이동할 위치를 입력하세요:\n'+TIERS.join(' / ')+' / 대기 / 삭제',movie.tier==='pool'?'대기':movie.tier);if(choice===null)return;const selected=choice.trim();if(selected==='삭제')move(movie.id,'trash');else if(selected==='대기')move(movie.id,'pool');else if(TIERS.includes(selected))move(movie.id,selected);else status.textContent='목록에 있는 등급 이름을 정확히 입력해 주세요.';});return card;}
function render(){tiers.replaceChildren();pool.replaceChildren();for(const tier of TIERS){const row=document.createElement('section');row.className='tier drop-target';row.dataset.destination=tier;const label=document.createElement('div');label.className='tier-name';label.textContent=tier;const cards=document.createElement('div');cards.className='cards';for(const movie of movies.filter(m=>m.tier===tier))cards.append(makeCard(movie));row.append(label,cards);tiers.append(row);}for(const movie of movies.filter(m=>m.tier==='pool'))pool.append(makeCard(movie));}
function endDrag(){trash.classList.remove('visible','over');document.querySelectorAll('.drop-target.over').forEach(el=>el.classList.remove('over'));}
document.addEventListener('dragover',e=>{const target=e.target.closest('.drop-target');if(!target)return;e.preventDefault();e.dataTransfer.dropEffect='move';target.classList.add('over');});
document.addEventListener('dragleave',e=>{const target=e.target.closest('.drop-target');if(target&&!target.contains(e.relatedTarget))target.classList.remove('over');});
document.addEventListener('drop',e=>{const target=e.target.closest('.drop-target');if(!target)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');move(id,target.dataset.destination);endDrag();});
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const title=titleInput.value.trim();if(!title)return;if(movies.some(m=>m.title.toLocaleLowerCase('ko-KR')===title.toLocaleLowerCase('ko-KR'))){status.textContent='이미 추가한 영화 제목입니다.';return;}const id=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);movies.push({id,title,tier:'pool'});save();render();titleInput.value='';titleInput.focus();status.textContent='영화를 추가했습니다.';});
render();
</script>
</body>
</html>
