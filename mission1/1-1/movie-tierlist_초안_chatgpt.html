<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 티어리스트</title>
<style>
  :root {
    --bg: #17151a;
    --panel: #221f27;
    --line: #3a3541;
    --text: #f1ede6;
    --sub: #a49eac;
    --gold: #e8b64c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    padding: 20px 16px 230px;
  }
  h1 { font-size: 22px; margin: 0 0 16px; max-width: 1000px; margin-inline: auto; }
  #tiers { max-width: 1000px; margin: 0 auto; display: grid; gap: 6px; }
  .tier { display: flex; min-height: 118px; background: var(--panel); border: 1px solid var(--line); }
  .tier-name {
    flex: 0 0 92px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: #17151a;
  }
  .zone { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 6px; transition: background .15s; }
  .zone.over { background: rgba(232, 182, 76, .16); }
  .card {
    width: 70px; height: 105px; flex: none; cursor: grab; border-radius: 3px; overflow: hidden;
    background: #000; border: 1px solid var(--line);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card.dragging { opacity: .35; }

  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #100e13; border-top: 2px solid var(--gold);
    padding: 10px 16px 14px;
  }
  .dock-inner { max-width: 1000px; margin: 0 auto; position: relative; }
  #pool-label { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  #pool { min-height: 117px; border: 1px dashed var(--line); padding: 6px; display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
  #pool.over { background: rgba(232, 182, 76, .16); }
  .bar { display: flex; gap: 10px; margin-top: 10px; }
  #search {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; font-family: inherit;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
  }
  #search:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  #trash {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 16px; border: 2px dashed #c4584f; color: #e78a82; border-radius: 4px; font-size: 14px;
  }
  #trash.over { background: rgba(196, 88, 79, .28); color: #fff; }

  #results {
    position: absolute; left: 0; right: 0; bottom: calc(100% - 0px); margin-bottom: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    max-height: 46vh; overflow-y: auto; display: none;
  }
  #results.open { display: block; }
  .result {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid var(--line);
    color: var(--text); font: inherit; cursor: pointer;
  }
  .result:hover, .result:focus-visible { background: #2e2a35; outline: none; }
  .result img { width: 40px; height: 60px; object-fit: cover; border-radius: 2px; flex: none; }
  .result small { color: var(--sub); display: block; margin-top: 2px; }
  .msg { padding: 14px; color: var(--sub); font-size: 14px; }

  @media (max-width: 560px) {
    .tier-name { flex-basis: 60px; font-size: 15px; }
    .card { width: 56px; height: 84px; }
    .tier { min-height: 96px; }
    #trash span.t { display: none; }
  }
</style>
</head>
<body>

<h1>🎬 영화 티어리스트</h1>
<main id="tiers"></main>

<div id="dock">
  <div class="dock-inner">
    <div id="results" role="listbox" aria-label="검색 결과"></div>
    <div id="pool-label">검색한 영화 — 여기서 등급 행으로 끌어다 놓으세요</div>
    <div id="pool" class="drop" data-zone="pool"></div>
    <div class="bar">
      <input id="search" type="search" placeholder="영화 제목을 검색하세요" autocomplete="off">
      <div id="trash" class="drop" data-zone="trash">🗑️ <span class="t">여기로 끌어서 삭제</span></div>
    </div>
  </div>
</div>

<script>
  // TMDB API 키를 아래 따옴표 안에 붙여 넣으세요.
  // (API 읽기 액세스 토큰 또는 API 키 둘 다 사용할 수 있어요)
  const TMDB_API_KEY = "";

  const TIERS = [
    { name: "걸작", color: "#e86a5f" },
    { name: "명작", color: "#ec9a56" },
    { name: "대작", color: "#e8c95a" },
    { name: "역작", color: "#8fcf7a" },
    { name: "수작", color: "#6fb8d8" },
    { name: "평작", color: "#9a8fd6" }
  ];
  const STORAGE_KEY = "movie-tierlist-v1";
  const IMG = "https://image.tmdb.org/t/p/w342";

  let state = load();

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s && Array.isArray(s.pool) && Array.isArray(s.rows) && s.rows.length === TIERS.length) return s;
    } catch (e) {}
    return { pool: [], rows: TIERS.map(() => []) };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- 렌더링 ----------
  const tiersEl = document.getElementById("tiers");
  const poolEl = document.getElementById("pool");

  function makeCard(m) {
    const c = document.createElement("div");
    c.className = "card";
    c.draggable = true;
    c.dataset.uid = m.uid;
    const img = document.createElement("img");
    img.src = IMG + m.poster;
    img.alt = "";
    c.appendChild(img);
    c.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", m.uid);
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => c.classList.add("dragging"), 0);
    });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
    return c;
  }

  function render() {
    tiersEl.innerHTML = "";
    TIERS.forEach((t, i) => {
      const row = document.createElement("section");
      row.className = "tier";
      const name = document.createElement("div");
      name.className = "tier-name";
      name.style.background = t.color;
      name.textContent = t.name;
      const zone = document.createElement("div");
      zone.className = "zone drop";
      zone.dataset.zone = String(i);
      state.rows[i].forEach(m => zone.appendChild(makeCard(m)));
      row.append(name, zone);
      tiersEl.appendChild(row);
    });
    poolEl.innerHTML = "";
    state.pool.forEach(m => poolEl.appendChild(makeCard(m)));
  }

  // ---------- 드래그 앤 드롭 ----------
  function move(uid, zone) {
    const lists = [state.pool, ...state.rows];
    let card = null;
    for (const list of lists) {
      const idx = list.findIndex(m => m.uid === uid);
      if (idx > -1) { card = list.splice(idx, 1)[0]; break; }
    }
    if (!card) return;
    if (zone === "pool") state.pool.push(card);
    else if (zone !== "trash") state.rows[Number(zone)].push(card);
    save();
    render();
  }

  document.addEventListener("dragover", e => {
    const z = e.target.closest(".drop");
    if (!z) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".drop.over").forEach(el => { if (el !== z) el.classList.remove("over"); });
    z.classList.add("over");
  });
  document.addEventListener("dragleave", e => {
    const z = e.target.closest(".drop");
    if (z && !z.contains(e.relatedTarget)) z.classList.remove("over");
  });
  document.addEventListener("drop", e => {
    const z = e.target.closest(".drop");
    document.querySelectorAll(".drop.over").forEach(el => el.classList.remove("over"));
    if (!z) return;
    e.preventDefault();
    move(e.dataTransfer.getData("text/plain"), z.dataset.zone);
  });
  document.addEventListener("dragend", () => {
    document.querySelectorAll(".drop.over").forEach(el => el.classList.remove("over"));
  });

  // ---------- TMDB 검색 ----------
  const searchEl = document.getElementById("search");
  const resultsEl = document.getElementById("results");
  let timer = null, seq = 0;

  function showMsg(text) {
    resultsEl.innerHTML = "";
    const d = document.createElement("div");
    d.className = "msg";
    d.textContent = text;
    resultsEl.appendChild(d);
    resultsEl.classList.add("open");
  }

  async function search(q) {
    if (!TMDB_API_KEY) {
      showMsg("TMDB API 키가 없어요. HTML 파일 위쪽의 TMDB_API_KEY에 키를 넣어 주세요.");
      return;
    }
    const my = ++seq;
    const isToken = TMDB_API_KEY.length > 40;
    const url = "https://api.themoviedb.org/3/search/movie?language=ko-KR&include_adult=false&query=" +
      encodeURIComponent(q) + (isToken ? "" : "&api_key=" + encodeURIComponent(TMDB_API_KEY));
    try {
      const res = await fetch(url, isToken ? { headers: { Authorization: "Bearer " + TMDB_API_KEY } } : undefined);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      if (my !== seq) return;
      const list = (data.results || []).filter(m => m.poster_path).slice(0, 10);
      if (!list.length) { showMsg("검색 결과가 없어요. 다른 제목으로 검색해 보세요."); return; }
      resultsEl.innerHTML = "";
      list.forEach(m => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "result";
        const img = document.createElement("img");
        img.src = "https://image.tmdb.org/t/p/w92" + m.poster_path;
        img.alt = "";
        const box = document.createElement("div");
        const title = document.createElement("div");
        title.textContent = m.title;
        const small = document.createElement("small");
        small.textContent = (m.release_date || "").slice(0, 4);
        box.append(title, small);
        b.append(img, box);
        b.addEventListener("click", () => addCard(m));
        resultsEl.appendChild(b);
      });
      resultsEl.classList.add("open");
    } catch (err) {
      if (my !== seq) return;
      showMsg("검색에 실패했어요. API 키와 인터넷 연결을 확인해 주세요.");
    }
  }

  function addCard(m) {
    const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    state.pool.push({ uid, id: m.id, poster: m.poster_path });
    save();
    render();
    resultsEl.classList.remove("open");
    searchEl.value = "";
  }

  searchEl.addEventListener("input", () => {
    clearTimeout(timer);
    const q = searchEl.value.trim();
    if (!q) { seq++; resultsEl.classList.remove("open"); return; }
    timer = setTimeout(() => search(q), 350);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".dock-inner")) resultsEl.classList.remove("open");
  });

  render();
</script>
</body>
</html>
